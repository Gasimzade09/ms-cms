databaseChangeLog:
  - changeSet:
      id: create-transfer-table
      author: Ali Gasimzade
      changes:
        - createTable:
            tableName: transfer
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: amount_from
                  type: numeric
              - column:
                  name: amount_to
                  type: numeric
              - column:
                  name: rate
                  type: numeric
              - column:
                  name: currency
                  type: varchar(3)
              - column:
                  name: from_card_id
                  type: bigint
              - column:
                  name: to_card_id
                  type: bigint
              - column:
                  name: user_id
                  type: bigint
              - column:
                  name: status
                  type: varchar(25)
              - column:
                  name: status_description
                  type: text
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP